# This is a Databricks asset bundle definition for flights_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: flights_bundle
  uuid: 7088513a-368e-41b0-94d8-2342e1d010b5

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  notifications:
    description: The email addresses to use for failure notifications

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-cbd8eaf5-099e.cloud.databricks.com
    variables:
      catalog: loomsight_catalog
      schema: ${workspace.current_user.short_name}
      notifications: []

  prod:
    mode: production
    workspace:
      host: https://dbc-cbd8eaf5-099e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/harrywatts125@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/harrywatts125@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: harrywatts125@gmail.com
        level: CAN_MANAGE
    variables:
      catalog: loomsight_catalog
      schema: default
      notifications: [harrywatts125@gmail.com]
